<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TAPWAR - Minimal Metro Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f6f5f0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.032) 1px, transparent 1px);
      background-size: 26px 26px;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    /* UI Overlay Layer */
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    /* Top Floating Bar */
    .top-bar {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      max-width: 96%;
    }
    .top-bar-main {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      pointer-events: auto;
      font-size: 13px;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .badge-player {
      color: #2563eb;
    }
    .badge-enemy {
      color: #dc2626;
    }
    .speed-control-group {
      display: flex;
      gap: 2px;
      background: #f1f5f9;
      padding: 2px 4px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      pointer-events: auto;
    }
    .speed-btn {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .speed-btn.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .status-banner {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      padding: 4px 14px;
      border-radius: 999px;
      color: #475569;
      font-size: 11.5px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      white-space: nowrap;
      pointer-events: auto;
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      width: 100%;
    }
    .guide-tip {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #64748b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      pointer-events: auto;
      max-width: 60%;
      line-height: 1.35;
    }

    /* Special Skill Button (Mini Metro FAB Style) */
    .map-credit {
      margin-top: 10px;
      font-size: 9.5px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Minimap */
    .minimap-card {
      background: rgba(246, 245, 240, 0.94);
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      touch-action: none;
      line-height: 0;
    }
    .minimap-card[hidden] {
      display: none;
    }
    #minimap {
      display: block;
      width: auto;
      height: auto;
      cursor: pointer;
    }

    /* Surrender Button (2단계 확인: 첫 탭 ➔ 확인 상태, 3초 안에 다시 탭 ➔ 항복) */
    .bottom-actions {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    .surrender-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.15s ease;
      pointer-events: auto;
      white-space: nowrap;
    }
    .surrender-btn:active {
      transform: scale(0.96);
    }
    .surrender-btn.armed {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
    }
    .surrender-btn[hidden] {
      display: none;
    }

    /* Modals - Clean Bauhaus/Mini Metro Card System */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(246, 245, 240, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 100;
      padding: 16px;
    }
    .modal-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 22px;
      padding: 24px 20px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.08);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .modal-brand-line {
      width: 24px;
      height: 4px;
      border-radius: 999px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .modal-desc {
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Mini Metro Stage Cards Grid */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .stage-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stage-card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }
    .stage-card.active {
      border-color: #0f172a !important;
      background: #ffffff !important;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12) !important;
      transform: translateY(-2px);
    }
    .stage-card-preview {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
    }
    .stage-name {
      font-weight: 800;
      font-size: 13.5px;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .stage-sub {
      font-size: 10px;
      color: #64748b;
      font-weight: 600;
    }
    .stage-record {
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #0f172a;
      font-weight: 700;
      width: 100%;
    }

    /* Start Button - Mini Metro Yellow Box Button */
    .start-btn {
      width: 100%;
      background: #eab308;
      color: #0f172a;
      border: none;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.35);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .start-btn:hover {
      background: #facc15;
      transform: translateY(-1px);
    }
    .start-btn:active {
      transform: scale(0.98);
    }

    /* Mobile Responsive Tweaks */
    @media (max-width: 480px) {
      .stage-grid {
        gap: 6px;
      }
      .stage-card {
        padding: 8px 4px;
      }
      .stage-name {
        font-size: 12px;
      }
      .stage-card-preview {
        height: 42px;
      }
      .top-bar-main {
        padding: 4px 10px;
        gap: 6px;
        font-size: 12px;
      }
      .guide-tip {
        display: none; /* 화면 작은 폰에서는 간결함을 위해 숨김 */
      }
    }

    /* ---------- Start screen (minimal & cute) ---------- */
    .start-card {
      max-width: 380px;
      padding: 28px 20px 18px;
      border-radius: 28px;
      border: none;
      box-shadow: 0 18px 50px rgba(30, 41, 59, 0.10);
    }
    .start-logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #1e293b;
      margin-bottom: 22px;
      display: inline-flex;
      align-items: flex-end;
      gap: 6px;
    }
    .logo-dots {
      display: inline-flex;
      gap: 4px;
      padding-bottom: 9px;
    }
    .logo-dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: block;
      animation: bob 1.4s ease-in-out infinite;
    }
    .logo-dots i:nth-child(1) { background: #60a5fa; }
    .logo-dots i:nth-child(2) { background: #fde047; animation-delay: 0.15s; }
    .logo-dots i:nth-child(3) { background: #f87171; animation-delay: 0.3s; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-dots i { animation: none; }
    }
    .start-card .stage-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .start-card .stage-card {
      font: inherit;
      background: #f7f6f2;
      border: 2.5px solid transparent;
      border-radius: 22px;
      padding: 12px 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      box-shadow: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .start-card .stage-card:hover { transform: translateY(-2px); }
    .start-card .stage-card.active {
      background: #ffffff !important;
      border-color: #1e293b !important;
      box-shadow: 0 6px 18px rgba(30, 41, 59, 0.10) !important;
    }
    .start-card .stage-card:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    .stage-thumb {
      width: 84px;
      height: 84px;
      margin-bottom: 4px;
    }
    .start-card .stage-name {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
      margin: 0;
    }
    .start-card .stage-sub {
      font-size: 11px;
      font-weight: 700;
      color: #a8a29e;
    }
    .start-card .stage-record {
      font-size: 11px;
      font-weight: 800;
      color: #b45309;
      border: none;
      margin: 0;
      padding: 0;
      min-height: 0;
      width: auto;
    }
    .start-card .stage-record:empty { display: none; }
    .start-card .start-btn {
      border-radius: 999px;
      font-size: 17px;
      padding: 14px 20px;
      background: #fde047;
      color: #1e293b;
      box-shadow: 0 6px 0 #eab308;
    }
    .start-card .start-btn:hover { background: #fde047; transform: none; }
    .start-card .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #eab308; }
    .start-card .map-credit { margin-top: 14px; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="top-bar-main">
          <div class="badge badge-player">🔵 <span id="player-count">1</span> <span id="player-full-count" style="color: #16a34a; font-size: 11px;">(🛡️0)</span></div>
          <div style="color: #cbd5e1; font-weight: 400;">|</div>
          <div class="badge badge-enemy">🔴 <span id="enemy-count">1</span> <span id="enemy-full-count" style="color: #dc2626; font-size: 11px;">(🛡️0)</span></div>
          <div style="color: #cbd5e1; font-weight: 400;">|</div>
          
          <!-- Stopwatch Timer & Record Badge -->
          <div class="badge" style="font-family: monospace; font-size: 13px; color: #b45309;">
            ⏱️ <span id="match-timer">00:00</span>
            <span id="best-timer-hud" style="color: #94a3b8; font-size: 10px; margin-left: 2px;">(미평정)</span>
          </div>

          <!-- Speed Controls -->
          <div class="speed-control-group">
            <button class="speed-btn active" id="speed-1x" onclick="setGameSpeed(1)">1x</button>
            <button class="speed-btn" id="speed-2x" onclick="setGameSpeed(2)">2x</button>
            <button class="speed-btn" id="speed-4x" onclick="setGameSpeed(4)">4x</button>
            <button class="speed-btn" id="speed-10x" onclick="setGameSpeed(10)">10x</button>
          </div>

        </div>

        <!-- Guide status banner -->
        <div class="status-banner" id="status-guide">내 거점을 드래그하여 목표 지역으로 연결하세요!</div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <!-- Minimap: 전체 전황 + 현재 보고 있는 화면 영역. 탭/드래그로 화면 이동 -->
        <div class="minimap-card" id="minimap-card" hidden>
          <canvas id="minimap"></canvas>
        </div>

        <div class="bottom-actions">
        <!-- Surrender -->
        <button id="surrender-btn" class="surrender-btn" onclick="onSurrenderClick()" hidden>🏳️ 항복</button>
        </div>
      </div>
    </div>

    <!-- Start Choice Modal (Mini Metro Style) -->
    <div class="modal-overlay" id="start-modal">
      <div class="modal-card start-card">
        <h1 class="start-logo">TAPWAR<span class="logo-dots"><i></i><i></i><i></i></span></h1>

        <div class="stage-grid">
          <button id="modal-map-korea" class="stage-card active" onclick="selectModalMap('KOREA')">
            <canvas class="stage-thumb" id="thumb-korea"></canvas>
            <span class="stage-name">전국</span>
            <span class="stage-sub">164</span>
            <span class="stage-record" id="modal-korea-record"></span>
          </button>
          <button id="modal-map-seoul" class="stage-card" onclick="selectModalMap('SEOUL')">
            <canvas class="stage-thumb" id="thumb-seoul"></canvas>
            <span class="stage-name">서울</span>
            <span class="stage-sub">25</span>
            <span class="stage-record" id="modal-seoul-record"></span>
          </button>
          <button id="modal-map-gyeonggi" class="stage-card" onclick="selectModalMap('GYEONGGI')">
            <canvas class="stage-thumb" id="thumb-gyeonggi"></canvas>
            <span class="stage-name">경기</span>
            <span class="stage-sub">31</span>
            <span class="stage-record" id="modal-gyeonggi-record"></span>
          </button>
          <button id="modal-map-suwon" class="stage-card" onclick="selectModalMap('SUWON')">
            <canvas class="stage-thumb" id="thumb-suwon"></canvas>
            <span class="stage-name">수원</span>
            <span class="stage-sub">44</span>
            <span class="stage-record" id="modal-suwon-record"></span>
          </button>
        </div>

        <button class="start-btn" id="start-btn" onclick="onStartBtnClick()">시작</button>
        <p class="map-credit">지도: 통계청 SGIS · vuski/admdongkor (CC BY 4.0) · southkorea/seoul-maps</p>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="end-modal" style="display: none;">
      <div class="modal-card" style="max-width: 440px;">
        <h2 id="end-title" style="font-size: 22px; font-weight: 800; margin-bottom: 12px;">게임 종료</h2>
        <div id="end-message" style="margin-bottom: 20px;"></div>
        <button class="start-btn" onclick="location.reload()">새로운 작전 시작 ➔</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=20261011_speedlimit05_v9"></script>
</body>
</html>
