<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TAPWAR - Minimal Metro Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none; /* iOS 길게 누르기 메뉴 방지 */
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f6f5f0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.032) 1px, transparent 1px);
      background-size: 26px 26px;
      color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    /* UI Overlay Layer */
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    }
    /* Top Floating Bar */
    .top-bar {
      align-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      max-width: 96%;
    }
    .top-bar-main {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      pointer-events: auto;
      font-size: 13px;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .badge-player {
      color: #2563eb;
    }
    .badge-enemy {
      color: #dc2626;
    }
    .speed-control-group {
      display: flex;
      gap: 2px;
      background: #f1f5f9;
      padding: 2px 4px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      pointer-events: auto;
    }
    .speed-btn {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .speed-btn.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .status-banner {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      padding: 4px 14px;
      border-radius: 999px;
      color: #475569;
      font-size: 11.5px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      white-space: nowrap;
      pointer-events: none; /* 안내 문구가 아래 지역의 탭을 가로채지 않도록 */
    }

    /* Bottom Control Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      width: 100%;
    }
    .guide-tip {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      color: #64748b;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      pointer-events: auto;
      max-width: 60%;
      line-height: 1.35;
    }

    /* Special Skill Button (Mini Metro FAB Style) */
    .map-credit {
      margin-top: 10px;
      font-size: 9.5px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Minimap */
    .minimap-card {
      background: rgba(246, 245, 240, 0.94);
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      pointer-events: auto;
      touch-action: none;
      line-height: 0;
    }
    .minimap-card[hidden] {
      display: none;
    }
    #minimap {
      display: block;
      width: auto;
      height: auto;
      cursor: pointer;
    }

    /* Surrender Button (2단계 확인: 첫 탭 ➔ 확인 상태, 3초 안에 다시 탭 ➔ 항복) */
    .bottom-actions {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }
    .surrender-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.15s ease;
      pointer-events: auto;
      white-space: nowrap;
    }
    .surrender-btn:active {
      transform: scale(0.96);
    }
    .surrender-btn.armed {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
    }
    .surrender-btn[hidden] {
      display: none;
    }

    /* Modals - Clean Bauhaus/Mini Metro Card System */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(246, 245, 240, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 100;
      padding: 16px;
    }
    .modal-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 22px;
      padding: 24px 20px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.08);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .modal-brand-line {
      width: 24px;
      height: 4px;
      border-radius: 999px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
    }
    .modal-desc {
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Mini Metro Stage Cards Grid */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .stage-card {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stage-card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }
    .stage-card.active {
      border-color: #0f172a !important;
      background: #ffffff !important;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12) !important;
      transform: translateY(-2px);
    }
    .stage-card-preview {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      position: relative;
    }
    .stage-name {
      font-weight: 800;
      font-size: 13.5px;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .stage-sub {
      font-size: 10px;
      color: #64748b;
      font-weight: 600;
    }
    .stage-record {
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px solid #e2e8f0;
      font-size: 10px;
      color: #0f172a;
      font-weight: 700;
      width: 100%;
    }

    /* Start Button - Mini Metro Yellow Box Button */
    .start-btn {
      width: 100%;
      background: #eab308;
      color: #0f172a;
      border: none;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.35);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .start-btn:hover {
      background: #facc15;
      transform: translateY(-1px);
    }
    .start-btn:active {
      transform: scale(0.98);
    }

    /* Mobile Responsive Tweaks */
    @media (max-width: 480px) {
      .stage-grid {
        gap: 6px;
      }
      .stage-card {
        padding: 8px 4px;
      }
      .stage-name {
        font-size: 12px;
      }
      .stage-card-preview {
        height: 42px;
      }
      .top-bar-main {
        padding: 4px 10px;
        gap: 6px;
        font-size: 12px;
      }
      .guide-tip {
        display: none; /* 화면 작은 폰에서는 간결함을 위해 숨김 */
      }
    }

    /* ---------- Start screen (minimal & cute) ---------- */
    .start-card {
      max-width: 380px;
      padding: 28px 20px 18px;
      border-radius: 28px;
      border: none;
      box-shadow: 0 18px 50px rgba(30, 41, 59, 0.10);
    }
    .start-logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #1e293b;
      margin-bottom: 22px;
      display: inline-flex;
      align-items: flex-end;
      gap: 6px;
    }
    .logo-dots {
      display: inline-flex;
      gap: 4px;
      padding-bottom: 9px;
    }
    .logo-dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: block;
      animation: bob 1.4s ease-in-out infinite;
    }
    .logo-dots i:nth-child(1) { background: #60a5fa; }
    .logo-dots i:nth-child(2) { background: #fde047; animation-delay: 0.15s; }
    .logo-dots i:nth-child(3) { background: #f87171; animation-delay: 0.3s; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-dots i { animation: none; }
    }
    /* 스테이지: 가로로 넘기는 슬라이드 */
    .start-card .stage-grid {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding: 6px 4px 10px;
      margin: 0 -20px 14px;
      padding-inline: 20px;
      scroll-padding-inline: 20px;
      scrollbar-width: none;
    }
    .start-card .stage-grid::-webkit-scrollbar { display: none; }
    .stage-wrap { position: relative; }
    .start-card .stage-grid { position: relative; } /* 카드 offsetLeft 기준을 슬라이드 안쪽으로 */
    .slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-60%);
      z-index: 2;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(30, 41, 59, 0.18);
      font: 800 20px/1 -apple-system, sans-serif;
      color: #1e293b;
      cursor: pointer;
      display: none;
    }
    .slide-arrow.left { left: -12px; }
    .slide-arrow.right { right: -12px; }
    /* 마우스가 있는 기기(PC)에서만 화살표 표시 */
    @media (hover: hover) and (pointer: fine) {
      .slide-arrow { display: block; }
      .start-card .stage-grid, .country-row { cursor: grab; }
    }
    .start-card .stage-grid .stage-card {
      flex: 0 0 44%;
      scroll-snap-align: center;
      padding: 16px 8px 14px;
    }
    .start-card .stage-card {
      font: inherit;
      background: #f7f6f2;
      border: 2.5px solid transparent;
      border-radius: 22px;
      padding: 12px 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      box-shadow: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .start-card .stage-card:hover { transform: translateY(-2px); }
    .start-card .stage-card.active {
      background: #ffffff !important;
      border-color: #1e293b !important;
      box-shadow: 0 6px 18px rgba(30, 41, 59, 0.10) !important;
    }
    .start-card .stage-card:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    .stage-thumb {
      width: 96px;
      height: 96px;
      margin-bottom: 4px;
    }
    .start-card .stage-name {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
      margin: 0;
    }
    .start-card .stage-sub {
      font-size: 11px;
      font-weight: 700;
      color: #a8a29e;
    }
    .start-card .stage-record {
      font-size: 11px;
      font-weight: 800;
      color: #b45309;
      border: none;
      margin: 0;
      padding: 0;
      min-height: 0;
      width: auto;
    }
    .start-card .stage-record:empty { display: none; }
    .start-card .start-btn {
      border-radius: 999px;
      font-size: 17px;
      padding: 14px 20px;
      background: #fde047;
      color: #1e293b;
      box-shadow: 0 6px 0 #eab308;
    }
    .start-card .start-btn:hover { background: #fde047; transform: none; }
    .start-card .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #eab308; }
    .start-card { position: relative; }
    .start-card .map-credit { margin-top: 14px; }
    .info-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #d6d3cd;
      background: transparent;
      color: #a8a29e;
      font: 700 12px/1 Georgia, serif;
      font-style: italic;
      cursor: pointer;
      padding: 0;
    }
    .info-btn:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    .map-credit[hidden] { display: none; }

    /* ---------- Home: 나라 선택 · 스테이지 잠금 · 튜토리얼 ---------- */
    .country-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin: -6px -4px 14px;
      padding: 2px 4px;
      scrollbar-width: none;
    }
    .country-row::-webkit-scrollbar { display: none; }
    .country-chip {
      flex: 0 0 auto;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: #f7f6f2;
      color: #1e293b;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    /* 국기를 박스에 꽉 차게(비율 유지, 가운데 잘라 쓰기) 반투명 배경으로 */
    .country-chip .flag-bg {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px;
      line-height: 1;
      opacity: 0.5;
      z-index: -1;
      pointer-events: none;
    }
    .country-chip .chip-name { position: relative; text-shadow: 0 0 4px #fff, 0 0 2px #fff; }
    .country-chip.active .chip-name { text-shadow: 0 0 4px #1e293b, 0 0 2px #1e293b; }
    .country-chip.active { background: #1e293b; color: #fff; }
    .country-chip.locked { color: #57534e; }
    .country-chip:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    .start-card .stage-card { position: relative; }
    .stage-no {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 11px;
      font-weight: 900;
      color: #a8a29e;
      font-variant-numeric: tabular-nums;
    }
    .stage-card.locked { cursor: pointer; }
    /* 잠긴 맵도 어떤 맵인지 알아볼 수 있게: 색은 살짝 흐리게, 자물쇠는 오른쪽 위에 작게 */
    .stage-card.locked .stage-thumb { filter: saturate(0.55) opacity(0.7); }
    .stage-card.locked .stage-name { color: #78716c; }
    .stage-card.locked .stage-sub { color: #c4c0b8; }
    .stage-lock {
      position: absolute;
      top: 7px;
      right: 9px;
      font-size: 13px;
    }
    .stage-card.cleared .stage-no::after { content: ' ✓'; color: #16a34a; }
    .home-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: #c4c0b8;
    }
    .link-btn {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #78716c;
      background: none;
      border: none;
      padding: 6px 4px;
      cursor: pointer;
    }
    .sheet-overlay { z-index: 300; }
    .top-timer {
      font: 800 15px/1 ui-monospace, "SF Mono", Menlo, monospace;
      color: #1e293b;
      font-variant-numeric: tabular-nums;
      padding: 8px 16px;
    }
    .top-timer[hidden], .status-banner[hidden] { display: none; }
    .speed2-btn { font-size: 15px; font-weight: 900; color: #1e293b; min-width: 54px; }
    .speed2-btn.on { background: #1e293b; color: #fde047; border-color: #1e293b; }
    .purchase-price { font-size: 22px; font-weight: 900; color: #1e293b; margin: -6px 0 16px; font-variant-numeric: tabular-nums; }
    .purchase-close { display: block; margin: 10px auto 0; }
    #confirm-base .tut-nav { margin-top: 4px; }
    /* 본진 확인 창: 뒤의 지도와 선택한 지역(노란색)이 비쳐 보이도록 흐림 없이 옅게 */
    #confirm-base {
      background: rgba(30, 41, 59, 0.12);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      align-items: center;
    }
    #confirm-base .sheet-card { box-shadow: 0 12px 40px rgba(30, 41, 59, 0.22); }
    .sheet-card, .tutorial-card {
      max-width: 340px;
      border-radius: 26px;
      border: none;
      padding: 26px 22px 20px;
      position: relative;
    }
    .sheet-icon { font-size: 40px; margin-bottom: 6px; }
    .sheet-title { font-size: 19px; font-weight: 900; color: #1e293b; margin-bottom: 6px; }
    .sheet-text { font-size: 14px; color: #57534e; line-height: 1.5; margin-bottom: 18px; white-space: pre-line; }
    #tutorial { z-index: 250; }
    .tut-skip {
      position: absolute;
      top: 14px;
      right: 16px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: #a8a29e;
      background: none;
      border: none;
      cursor: pointer;
    }
    .tut-art { height: 150px; display: flex; align-items: center; justify-content: center; margin: 8px 0 10px; }
    .tut-art svg { width: 210px; height: 150px; }
    .tut-title { font-size: 20px; font-weight: 900; color: #1e293b; margin-bottom: 6px; text-wrap: balance; }
    .tut-text { font-size: 14px; color: #57534e; line-height: 1.55; min-height: 66px; text-wrap: balance; }
    .tut-dots { display: flex; justify-content: center; gap: 6px; margin: 14px 0; }
    .tut-dots i { width: 7px; height: 7px; border-radius: 50%; background: #e7e5e4; display: block; }
    .tut-dots i.on { background: #1e293b; width: 18px; border-radius: 999px; }
    .tut-nav { display: flex; gap: 10px; align-items: center; }
    .tut-prev {
      font: inherit;
      font-weight: 800;
      font-size: 15px;
      color: #78716c;
      background: #f7f6f2;
      border: none;
      border-radius: 999px;
      padding: 14px 18px;
      cursor: pointer;
    }
    .tut-prev[disabled] { visibility: hidden; }
    .tut-prev { white-space: nowrap; min-width: 72px; }
    .tutorial-card .start-btn { flex: 1; border-radius: 999px; background: #fde047; box-shadow: 0 5px 0 #eab308; font-size: 16px; }
    .sheet-card .start-btn { border-radius: 999px; background: #fde047; box-shadow: 0 5px 0 #eab308; }
    /* 홈 화면: 흰 화면이 휴대폰 전체를 꽉 채움 */
    #start-modal { padding: 0; background: #ffffff; }
    .start-card > :not(.info-btn):not(.start-logo) { width: 100%; max-width: 460px; margin-inline: auto; }
    .start-card > .info-btn { top: max(14px, calc(env(safe-area-inset-top) + 4px)); }
    .start-card {
      width: 100%;
      max-width: none;
      height: 100%;
      min-height: 0;
      border-radius: 0;
      box-shadow: none;
      padding: max(36px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
    .start-logo { font-size: 50px; margin-bottom: 30px; align-self: center; }
    .country-chip { font-size: 15px; padding: 13px 20px; }
    .start-card .stage-grid { margin-inline: -24px; padding-inline: calc(50% + 24px - var(--stage-card-w) / 2); scroll-padding-inline: 0; --stage-card-w: min(250px, 62vw); }
    .start-card .stage-grid .stage-card { flex: 0 0 var(--stage-card-w); padding: 22px 10px 20px; box-sizing: border-box; }
    .stage-thumb { width: 170px; height: 170px; }
    /* 맵 카드 글씨 크게: 이름 옆에 지역 수, 아래 최고 기록 */
    .start-card .stage-title { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
    .start-card .stage-name { font-size: 26px; }
    .start-card .stage-title .stage-sub { font-size: 16px; font-weight: 800; color: #a8a29e; }
    .start-card .stage-record { font-size: 22px; font-weight: 900; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .start-card .stage-no { font-size: 14px; }
    .map-rank-btn { margin-top: 6px; font-size: 14px; font-weight: 800; color: #2563eb; background: #eff6ff; border-radius: 999px; padding: 4px 14px; }
    .start-card .start-btn { font-size: 21px; padding-block: 20px; margin-top: 10px; }
    .home-links { font-size: 15px; }
    /* 잠긴 맵: 검은 막(투명도 50%)을 씌워 어둡게 */
    .start-card .stage-card.locked { overflow: hidden; }
    .start-card .stage-card.locked::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      border-radius: inherit;
      pointer-events: none;
    }
    /* 나라 버튼: 선택한 나라는 국기를 선명하게, 잠긴 나라는 검은 막(50%)으로 어둡게 */
    .country-chip.active { background: #ffffff; color: #ffffff; border-color: #1e293b; }
    .country-chip.active .flag-bg { opacity: 1; }
    .country-chip.active .chip-name { text-shadow: 0 0 4px #000, 0 0 2px #000; }
    .country-chip.locked { color: #ffffff; }
    .country-chip.locked .chip-name { z-index: 1; text-shadow: 0 0 3px rgba(0,0,0,0.6); }
    .country-chip.locked::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    /* 홈: 국가 고르기 → 도시 맵 고르기 2단계 */
    .home-view { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .home-view[hidden] { display: none; }
    .home-view > :not(.start-logo):not(.back-btn) { width: 100%; max-width: 460px; }
    .back-btn {
      position: absolute;
      top: max(14px, calc(env(safe-area-inset-top) + 4px));
      left: 16px;
      width: 38px; height: 38px;
      border: none; border-radius: 50%;
      background: #f7f6f2; color: #1e293b;
      font: 800 24px/1 -apple-system, sans-serif;
      cursor: pointer;
    }
    .stage-progress {
      text-align: center;
      font-size: 17px; font-weight: 900; color: #78716c;
      margin: -14px 0 4px;
      font-variant-numeric: tabular-nums;
    }
    .start-card .ranking-card { justify-content: center; }
    .ranking-title { font-size: 40px; font-weight: 900; color: #1e293b; letter-spacing: 2px; }
    .ranking-time { font-size: 26px; font-weight: 900; color: #2563eb; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
    .stage-total-time { text-align: center; font-size: 14px; font-weight: 800; color: #a8a29e; margin-bottom: 16px; min-height: 18px; font-variant-numeric: tabular-nums; }
    .end-total { font-size: 14px; font-weight: 800; color: #475569; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .country-flag { font-size: 120px; line-height: 1.25; margin-bottom: 6px; }
    .start-card .stage-card.locked .country-flag { filter: saturate(0.7); }
    #enter-btn.locked { opacity: 0.45; }
    #splash {
      position: fixed; inset: 0; z-index: 400;
      background: #ffffff;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .splash-text {
      font-size: 50px; font-weight: 900; letter-spacing: -1px; color: #1e293b;
      display: inline-flex; align-items: center;
    }
    .splash-caret { width: 4px; height: 0.9em; background: #1e293b; margin-left: 4px; animation: caret 0.6s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
    /* 화면 가운데 글자만 2초 떴다 사라지는 안내 */
    #center-toast {
      position: fixed; left: 0; right: 0; top: 50%;
      transform: translateY(-50%);
      text-align: center; z-index: 150; pointer-events: none;
      font-size: 26px; font-weight: 900; color: #1e293b;
      text-shadow: 0 0 6px #fff, 0 0 3px #fff, 0 0 12px #fff;
      opacity: 0;
    }
    #center-toast.show { animation: center-toast 2.5s ease forwards; } /* 약 2초 보였다 사라짐 */
    @keyframes center-toast {
      0% { opacity: 0; transform: translateY(-40%); }
      8% { opacity: 1; transform: translateY(-50%); }
      88% { opacity: 1; }
      100% { opacity: 0; }
    }
    /* 결과 창 */
    .end-card { text-align: center; }
    .end-sub { font-size: 17px; font-weight: 800; color: #334155; margin-bottom: 22px; }
    .end-record-label { font-size: 13px; font-weight: 800; color: #94a3b8; letter-spacing: 2px; }
    .end-record { font-size: 44px; font-weight: 900; color: #111; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .end-best { font-size: 13px; font-weight: 700; color: #94a3b8; margin-top: 4px; }
    .end-best.new { color: #16a34a; }
    #end-next-btn[hidden], #end-retry-btn[hidden] { display: none; }
    .end-actions { display: flex; gap: 10px; align-items: stretch; margin-top: 18px; }
    .end-actions .start-btn { flex: 1; width: auto; margin: 0; }
    .end-home-btn {
      flex: 1;
      font: inherit; font-size: 16px; font-weight: 800; color: #57534e;
      background: #f7f6f2; border: none; border-radius: 999px; padding: 14px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <!-- Top Bar -->
      <div class="top-bar">
        <!-- 상단: 플레이 시간만 표시 -->
        <div class="top-bar-main top-timer" id="top-timer" hidden>
          <span id="match-timer">00:00</span>
        </div>

        <!-- Guide status banner -->
        <!-- 본진 고르는 동안에만 표시 -->
        <div class="status-banner" id="status-guide" hidden>본진을 선택하세요</div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <!-- Minimap: 전체 전황 + 현재 보고 있는 화면 영역. 탭/드래그로 화면 이동 -->
        <div class="minimap-card" id="minimap-card" hidden>
          <canvas id="minimap"></canvas>
        </div>

        <div class="bottom-actions">
        <!-- Surrender -->
        <!-- Home: 시작 지역을 고르는 동안에만 표시, 전장 선택 화면으로 돌아감 -->
        <button id="home-btn" class="surrender-btn" onclick="goHome()" hidden>← 홈</button>
        <button id="surrender-btn" class="surrender-btn" onclick="onSurrenderClick()" hidden>항복</button>
        <!-- 게임 중 ×2 배속 (유료: 구매 전에는 결제 화면으로) -->
        <button id="speed2-btn" class="surrender-btn speed2-btn" onclick="onSpeed2Click()" hidden>×2</button>
        </div>
      </div>
    </div>

    <!-- 앱 첫 실행 연출: TAPWAR 가 가운데에서 타이핑되듯 완성된 뒤 홈으로 -->
    <div id="center-toast" aria-live="polite"></div>
    <div id="splash" aria-hidden="true"><h1 class="splash-text"><span id="splash-text"></span><i class="splash-caret"></i></h1></div>

    <!-- Start Choice Modal (Mini Metro Style) -->
    <div class="modal-overlay" id="start-modal">
      <div class="modal-card start-card">
        <!-- 1단계: 국가 고르기 (맵 고르기처럼 가로 슬라이드) -->
        <div class="home-view" id="country-view">
          <h1 class="start-logo" id="start-logo">TAPWAR</h1>
          <div class="stage-wrap">
            <button class="slide-arrow left" aria-label="이전 국가" onclick="slideGrid('country-grid', -1)">‹</button>
            <div class="stage-grid" id="country-grid"></div>
            <button class="slide-arrow right" aria-label="다음 국가" onclick="slideGrid('country-grid', 1)">›</button>
          </div>
          <button class="start-btn" id="enter-btn" onclick="enterCountry()">참전하기</button>
        </div>

        <!-- 2단계: 고른 국가의 도시 맵 (구역이 적은 맵부터, 앞 맵을 클리어하면 다음 맵이 열림) -->
        <div class="home-view" id="stage-view" hidden>
          <button class="back-btn" aria-label="국가 선택으로" onclick="showCountryView()">‹</button>
          <h1 class="start-logo" id="country-title">대한민국</h1>
          <div class="stage-progress" id="stage-progress">0/17</div>
          <div class="stage-total-time" id="stage-total-time"></div>
          <div class="stage-wrap">
            <button class="slide-arrow left" aria-label="이전 맵" onclick="slideGrid('stage-grid', -1)">‹</button>
            <div class="stage-grid" id="stage-grid"></div>
            <button class="slide-arrow right" aria-label="다음 맵" onclick="slideGrid('stage-grid', 1)">›</button>
          </div>
          <button class="start-btn" id="start-btn" onclick="onStartBtnClick()">시작</button>
        </div>

        <div class="home-links">
          <button class="link-btn" onclick="openTutorial()">튜토리얼</button>
          <span aria-hidden="true">·</span>
          <button class="link-btn" onclick="restorePurchases()">구매 복원</button>
        </div>
        <!-- 지도 데이터 출처(라이선스상 표시 필수): 첫 화면에는 ⓘ 버튼만, 누르면 표시 -->
        <button class="info-btn" id="info-btn" aria-label="지도 출처" onclick="document.getElementById('map-credit').hidden = !document.getElementById('map-credit').hidden">i</button>
        <p class="map-credit" id="map-credit" hidden>지도: 통계청 SGIS(공공누리 제1유형) · vuski/admdongkor (CC BY 4.0) · southkorea/seoul-maps<br><span id="build-ver">웹 버전</span></p>
      </div>
    </div>

    <!-- 안내 시트 (잠긴 나라·잠긴 맵·구매 복원 등) -->
    <div class="modal-overlay sheet-overlay" id="sheet" style="display: none;" onclick="if (event.target === this) closeSheet()">
      <div class="modal-card sheet-card">
        <div class="sheet-icon" id="sheet-icon"></div>
        <h2 class="sheet-title" id="sheet-title"></h2>
        <p class="sheet-text" id="sheet-text"></p>
        <button class="start-btn" onclick="closeSheet()">확인</button>
      </div>
    </div>

    <!-- 본진 지정 확인 -->
    <div class="modal-overlay sheet-overlay" id="confirm-base" style="display: none;">
      <div class="modal-card sheet-card">
        <h2 class="sheet-title" id="confirm-base-name"></h2>
        <p class="sheet-text">본진으로 지정하시겠습니까?</p>
        <div class="tut-nav">
          <button class="tut-prev" onclick="cancelBaseSelection()">취소</button>
          <button class="start-btn tut-next" onclick="confirmBaseSelection()">확인</button>
        </div>
      </div>
    </div>

    <!-- 결제 화면 (인앱 구매) -->
    <div class="modal-overlay sheet-overlay" id="purchase" style="display: none;" onclick="if (event.target === this) closePurchase()">
      <div class="modal-card sheet-card">
        <h2 class="sheet-title" id="purchase-title"></h2>
        <p class="sheet-text" id="purchase-text"></p>
        <div class="purchase-price" id="purchase-price"></div>
        <button class="start-btn" id="purchase-buy" onclick="buyProduct()">구매하기</button>
        <button class="link-btn purchase-close" onclick="closePurchase()">닫기</button>
      </div>
    </div>

    <!-- 튜토리얼 -->
    <div class="modal-overlay" id="tutorial" style="display: none;">
      <div class="modal-card tutorial-card">
        <button class="tut-skip" onclick="closeTutorial()">건너뛰기</button>
        <div class="tut-art" id="tut-art"></div>
        <h2 class="tut-title" id="tut-title"></h2>
        <p class="tut-text" id="tut-text"></p>
        <div class="tut-dots" id="tut-dots"></div>
        <div class="tut-nav">
          <button class="tut-prev" id="tut-prev" onclick="tutorialStep(-1)">이전</button>
          <button class="start-btn tut-next" id="tut-next" onclick="tutorialStep(1)">다음</button>
        </div>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal-overlay" id="end-modal" style="display: none;">
      <div class="modal-card end-card" style="max-width: 440px;">
        <h2 id="end-title" style="font-size: 26px; font-weight: 900; margin-bottom: 6px;">게임 종료</h2>
        <div id="end-message" style="margin-bottom: 20px;"></div>
        <div class="end-actions">
          <button class="end-home-btn" onclick="location.reload()">홈으로</button>
          <button class="start-btn" id="end-next-btn" onclick="goNextStage()" hidden>다음 맵으로</button>
          <button class="start-btn" id="end-retry-btn" onclick="retryStage()" hidden>다시 도전</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js?v=20261011_speedlimit05_v9"></script>
</body>
</html>
