<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a2140">
<title>모두의 힐러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root { --bg:#2a2140; --panel:#3a2f57; --panel2:#4a3d6e; --text:#fff8ec; --dim:#b8aecf; --pri:#7c5cff; --gold:#ffb347; --red:#e5546a; --green:#57d38c; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
#app { position:fixed; inset:0; max-width:520px; margin:0 auto; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.btn { border:0; border-radius:12px; padding:11px 14px; margin:4px 0; background:var(--panel2); color:var(--text); font-size:14px; font-weight:600; width:100%; box-shadow:0 3px 0 #0004; }
.btn:active { transform:translateY(2px); box-shadow:0 1px 0 #0004; }
.btn.sm { width:auto; padding:6px 10px; font-size:12px; border-radius:9px; margin:2px; }
.btn.pri { background:var(--pri); } .btn.red { background:var(--red); } .btn.gold { background:var(--gold); color:#3a2300; }
small { font-size:11px; } .dim { color:var(--dim); } .bad { color:#ff8a9a; } .hot { color:var(--gold); }
h4 { margin:16px 0 6px; font-size:14px; color:#ffe9b0; } h4 small { color:var(--dim); font-weight:400; }

/* ---------- 마을 ---------- */
#town { flex:1; display:flex; flex-direction:column; min-height:0; }
#top { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#0003; font-size:13px; }
.tb-l { display:flex; align-items:center; gap:6px; } .xp { width:60px; height:6px; background:#0006; border-radius:4px; overflow:hidden; } .xp i { display:block; height:100%; background:var(--green); }
.title { text-align:center; padding:14px 0 4px; }
.title h1 { margin:0; font-size:30px; letter-spacing:2px; background:linear-gradient(#fff6c8,#ffb347); -webkit-background-clip:text; color:transparent; text-shadow:0 2px 12px #ffb34744; }
.title p { margin:2px 0; font-size:12px; color:var(--dim); }
#town-info { text-align:center; font-size:12px; color:var(--dim); padding:0 10px 6px; }
.tower-btn { margin:6px 16px 10px; padding:16px; border-radius:18px; background:linear-gradient(135deg,#7c5cff,#c25cff); font-size:18px; font-weight:800; text-align:center; box-shadow:0 5px 0 #4a2fa0; }
.tower-btn:active { transform:translateY(3px); box-shadow:0 2px 0 #4a2fa0; }
.grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:4px 16px 20px; align-content:start; }
.bld { background:var(--panel); border-radius:16px; padding:12px 4px; text-align:center; box-shadow:0 4px 0 #0004; }
.bld:active { transform:translateY(2px); }
.bld .e { font-size:30px; display:block; } .bld b { font-size:13px; } .bld small { display:block; color:var(--dim); font-size:10px; margin-top:2px; }

/* ---------- 시트/팝업 ---------- */
#sheet { position:fixed; inset:0; background:#0008; display:none; z-index:10; }
#sheet.open { display:flex; align-items:flex-end; justify-content:center; }
.sheet-in { background:var(--bg); width:100%; max-width:520px; height:88%; border-radius:22px 22px 0 0; display:flex; flex-direction:column; animation:up .2s; }
@keyframes up { from { transform:translateY(40px); opacity:.5; } }
.sheet-h { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #fff1; font-size:17px; font-weight:800; }
.sheet-h button { background:none; border:0; color:var(--text); font-size:22px; }
#sheet-body { flex:1; overflow-y:auto; padding:6px 16px 40px; }
#popup, #boon { position:fixed; inset:0; background:#000a; display:none; z-index:20; align-items:center; justify-content:center; padding:16px; }
#popup.open, #boon.open { display:flex; }
.pop { background:var(--panel); border-radius:18px; padding:18px; width:100%; max-width:380px; max-height:85%; overflow-y:auto; font-size:14px; line-height:1.5; box-shadow:0 10px 40px #0008; }
.pop hr { border:0; border-top:1px solid #fff2; }
#popup-btns, #boon-btns { margin-top:12px; }
#toasts { position:fixed; top:60px; left:0; right:0; z-index:30; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
.toast { background:#000c; padding:8px 14px; border-radius:20px; font-size:13px; transition:.4s; max-width:90%; text-align:center; }
.toast.out { opacity:0; transform:translateY(-10px); }

.npc { background:var(--panel); padding:10px 12px; border-radius:12px; font-size:13px; margin:8px 0; }
.quest { background:var(--panel); padding:10px 12px; border-radius:12px; font-size:13px; margin:6px 0; line-height:1.5; }
.quest.main { border:1px solid var(--gold); } .quest.hidden { border:1px dashed #c9f; }
.qbar { height:6px; background:#0005; border-radius:4px; overflow:hidden; margin:4px 0 2px; } .qbar i { display:block; height:100%; background:var(--green); } .qbar.fat i { background:var(--red); }
.row-c { display:flex; gap:12px; align-items:center; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.stat { background:var(--panel); border-radius:10px; padding:6px 10px; display:flex; align-items:center; gap:6px; font-size:13px; }
.stat span { flex:1; } .stat small { color:var(--dim); }
.equip { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.eslot { background:var(--panel); border-radius:10px; padding:6px 2px; text-align:center; font-size:10px; min-height:62px; }
.eslot small { display:block; font-size:10px; line-height:1.2; margin-top:2px; }
.ic { display:inline-flex; width:34px; height:34px; align-items:center; justify-content:center; border:2px solid; border-radius:9px; font-size:18px; background:#0003; }
.ic.empty { border-color:#fff2; opacity:.4; } .ic.sm { width:24px; height:24px; font-size:13px; border-radius:6px; }
.bag { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
.bitem { position:relative; aspect-ratio:1; border:2px solid; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--panel); }
.bitem.nowear { opacity:.55; } .bitem i { position:absolute; right:2px; bottom:0; font-size:9px; font-style:normal; color:var(--gold); } .bitem s { position:absolute; left:3px; top:0; font-size:9px; text-decoration:none; color:#c9f; }
.cons { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .cons span { background:var(--panel); padding:4px 8px; border-radius:8px; font-size:11px; }
.beltrow { display:flex; gap:8px; } .bslot { width:52px; height:52px; border-radius:12px; background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; border:2px dashed #fff3; }
.bslot.locked { opacity:.4; } .bslot small { font-size:10px; }
.affix { color:#7fc8ff; } .set { color:#d7a6ff; }
.party-list { display:flex; flex-direction:column; gap:6px; }
.pm { display:flex; align-items:center; gap:10px; background:var(--panel); border-radius:12px; padding:6px 10px; font-size:13px; }
.pm > div:nth-child(2) { flex:1; } .pm small { display:block; color:var(--dim); }
.pm.me { border:1px solid #f5e17a66; } .col { display:flex; flex-direction:column; }
.chibi { width:40px; height:44px; flex:none; } .chibi.big { width:70px; height:77px; }
.shoprow { display:flex; align-items:center; gap:6px; background:var(--panel); border-radius:10px; padding:8px 10px; margin:5px 0; font-size:13px; }
.shoprow > span { flex:1; } .shoprow small { color:var(--dim); } .shoprow.locked { opacity:.5; }
.loadout { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.lslot { background:var(--panel); border-radius:10px; padding:8px 2px; text-align:center; font-size:22px; min-height:58px; }
.lslot small { display:block; font-size:10px; }
.warn { background:#e5546a33; border:1px solid var(--red); border-radius:10px; padding:8px; font-size:12px; margin:8px 0; }
.cps { display:flex; flex-wrap:wrap; gap:6px; } .cps .btn { width:auto; flex:1 0 30%; }

/* ---------- 전투 ---------- */
#battle { flex:1; display:none; flex-direction:column; min-height:0; background:#15101f; }
#b-top { display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:12px; background:#0005; flex-wrap:wrap; }
#b-top > span:first-child { flex:1; } .buffs i { font-style:normal; background:#2e5d8a; border-radius:6px; padding:1px 5px; margin-right:3px; font-size:10px; }
#cvwrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; touch-action:none; }
#cv { touch-action:none; border-radius:8px; }
#b-party { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; padding:6px 6px 2px; }
.pf { background:var(--panel); border-radius:9px; padding:4px; border:2px solid transparent; min-height:52px; }
.pf.sel { border-color:#7cf; background:#3d4f80; } .pf.dead { opacity:.5; filter:grayscale(1); }
.pn { font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hpb { position:relative; height:14px; background:#0007; border-radius:5px; overflow:hidden; margin-top:2px; }
.hpb i { display:block; height:100%; transition:width .1s; } .hpb span { position:absolute; inset:0; font-size:9px; text-align:center; line-height:14px; text-shadow:0 1px 1px #000; }
.pc { font-size:11px; min-height:13px; line-height:13px; }
#b-me { padding:2px 8px; display:grid; grid-template-columns:1fr 1fr; gap:3px; }
.mbar { position:relative; height:16px; background:#0007; border-radius:6px; overflow:hidden; }
.mbar i { display:block; height:100%; } .mbar span { position:absolute; inset:0; font-size:10px; text-align:center; line-height:16px; text-shadow:0 1px 1px #000; }
.mbar.hp i { background:#d94a5c; } .mbar.mp i { background:#3d7cff; } .mbar.cast { grid-column:1/3; } .mbar.cast i { background:#ffd23f; } .mbar.cast.idle span { color:var(--dim); }
#b-skills { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; padding:6px 8px 10px; }
.sk { position:relative; height:54px; border:0; border-radius:12px; background:var(--panel2); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 3px 0 #0005; touch-action:none; }
.sk span { font-size:20px; line-height:1; } .sk small { font-size:9px; margin-top:2px; white-space:nowrap; }
.sk em { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:18px; font-weight:800; text-shadow:0 0 4px #000; }
.sk.off { opacity:.45; } .sk:active { transform:translateY(2px); box-shadow:0 1px 0 #0005; }
.sk.ult { background:linear-gradient(135deg,#ffb347,#ff6fa8); }
.boons { display:flex; flex-direction:column; gap:8px; }
.boon { background:var(--panel2); border-radius:14px; padding:10px; display:grid; grid-template-columns:40px 1fr; grid-template-rows:auto auto; align-items:center; column-gap:8px; }
.boon:active { background:var(--pri); } .boon .bi { grid-row:1/3; font-size:28px; text-align:center; } .boon small { color:var(--dim); }
.hiddenq { background:#6a3fa066; border:1px dashed #c9f; padding:6px; border-radius:8px; margin:6px 0; font-size:12px; }
.pop h3 { margin:0 0 6px; }

/* ===== 카툰 스킨 (레퍼런스 스타일) ===== */
:root { --ink:#1b1530; --bg:#1d2a4d; --panel:#2b3d6b; --panel2:#3a5190; --pri:#3fa9ff; }
html,body { font-family:"Jua",-apple-system,"Apple SD Gothic Neo",sans-serif; background:#141d38; }
body { background:radial-gradient(circle at 50% 0%,#2f4380,#141d38 70%); }
.btn { border:2.5px solid var(--ink); box-shadow:0 4px 0 var(--ink); font-weight:400; font-size:15px; text-shadow:0 1px 0 #0006; }
.btn.pri { background:linear-gradient(#5cc0ff,#2f86e0); } .btn.gold { background:linear-gradient(#ffe066,#ffb020); color:var(--ink); text-shadow:none; } .btn.red { background:linear-gradient(#ff7a8a,#e03a52); }
.bld, .quest, .npc, .pm, .shoprow, .stat, .eslot, .lslot, .pop, .boon { border:2.5px solid var(--ink); box-shadow:0 4px 0 var(--ink); }
.bld { background:linear-gradient(#3a5190,#2b3d6b); border-radius:18px; } .bld .e { font-size:34px; filter:drop-shadow(0 2px 0 var(--ink)); }
.pop { background:#2b3d6b; border-width:3px; }
#top { background:linear-gradient(#24356a,#18244a); border-bottom:3px solid var(--ink); font-size:15px; }
.title h1 { font-size:38px; -webkit-text-stroke:0; color:#ffe066; background:none; -webkit-background-clip:initial; text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 6px 12px #0008; }
.tower-btn { border:3px solid var(--ink); background:linear-gradient(#ffcf4d,#ff9b1f); color:var(--ink); font-size:22px; box-shadow:0 6px 0 var(--ink); }
.tower-btn:active { box-shadow:0 2px 0 var(--ink); }
.sheet-in { background:#1d2a4d; border-top:3px solid var(--ink); }

/* 전투 HUD */
#battle { background:#0f1630; }
#b-top { display:block; padding:0; background:none; position:relative; }
.hud { display:flex; align-items:center; gap:8px; padding:6px 10px; background:linear-gradient(#24356a,#18244a); border-bottom:3px solid var(--ink); }
.hud-pause { width:40px; height:40px; border-radius:12px; border:2.5px solid var(--ink); background:#e9eef7; font-size:18px; box-shadow:0 3px 0 var(--ink); }
.hud-floor { flex:1; text-align:center; }
.hud-floor b { display:inline-block; font-size:28px; color:#fff; padding:0 18px; background:#141d38; border:2.5px solid var(--ink); border-radius:0 0 16px 16px; text-shadow:0 2px 0 var(--ink); clip-path:polygon(0 0,100% 0,88% 100%,12% 100%); }
.hud-floor i { display:block; font-style:normal; color:#ff4d5e; font-size:12px; text-shadow:0 1px 0 #000; }
.hud-res { display:flex; flex-direction:column; gap:2px; font-size:14px; }
.hud-res span { background:#0e1530; border:2px solid var(--ink); border-radius:10px; padding:1px 8px; text-align:right; min-width:70px; }
.hud-prog { display:flex; align-items:center; gap:6px; margin:6px 10px 2px; padding:3px; background:#fff; border:2.5px solid var(--ink); border-radius:12px; }
.hud-prog .segs { flex:1; display:flex; gap:3px; } .hud-prog .segs i { flex:1; height:12px; background:#d9dee8; transform:skewX(-20deg); border-radius:2px; }
.hud-prog .segs i.on { background:linear-gradient(#6df07a,#27b33a); }
.hud-prog b { color:var(--ink); font-size:15px; padding:0 4px; }
.buffs { position:absolute; left:8px; top:96px; display:flex; flex-direction:column; gap:3px; z-index:2; pointer-events:none; }
.buffs i { font-style:normal; background:#2b3d6bcc; border:2px solid var(--ink); border-radius:8px; padding:1px 6px; font-size:11px; }
#cvwrap { padding:2px 4px; }
#cv { border:3px solid var(--ink); border-radius:12px; }
.pf { background:linear-gradient(#2f4380,#24356a); border:2.5px solid var(--ink); box-shadow:0 3px 0 var(--ink); border-radius:12px; }
.pf.sel { border-color:#3ff0ff; background:linear-gradient(#3a6ab8,#2b4a8f); box-shadow:0 0 0 2px #3ff0ff66,0 3px 0 var(--ink); }
.hpb, .mbar { border:2px solid var(--ink); }
.mbar.hp i { background:linear-gradient(#ff7a8a,#e03a52); } .mbar.mp i { background:linear-gradient(#6fb7ff,#2f6fe0); } .mbar.cast i { background:linear-gradient(#ffe066,#ffb020); }
.sk { background:radial-gradient(circle at 50% 30%,#4f6cb8,#2b3d6b); border:2.5px solid var(--ink); border-radius:50%; width:56px; height:56px; justify-self:center; box-shadow:0 4px 0 var(--ink),inset 0 2px 0 #ffffff33; }
.sk span { font-size:24px; filter:drop-shadow(0 2px 0 var(--ink)); } .sk small { font-size:9px; position:absolute; bottom:-14px; white-space:nowrap; text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000; }
.sk.ult { background:radial-gradient(circle at 50% 30%,#ffe066,#ff8a1f); }
.sk em { border-radius:50%; } .sk.off em:not(:empty) { background:#0009; }
#b-skills { row-gap:20px; padding-bottom:22px; }

/* ===== 마을 지도 ===== */
#top { display:flex; align-items:center; gap:8px; padding:8px 10px 8px 6px; background:linear-gradient(100deg,#1e3a78,#16295a 60%,#1e3a78); border-bottom:3px solid var(--ink); position:relative; z-index:3; }
.th-lv { width:52px; height:56px; flex:none; display:flex; align-items:center; justify-content:center; background:linear-gradient(#7fe0ff,#2f9be8); border:3px solid #fff; outline:2.5px solid var(--ink); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.th-lv b { font-size:22px; color:#fff; text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink); }
.th-mid { flex:1; min-width:0; }
.th-row { display:flex; align-items:center; gap:6px; }
.th-power { font-size:15px; color:#fff; text-shadow:0 2px 0 var(--ink); white-space:nowrap; } .th-power b { font-size:19px; }
.th-pill { flex:1; display:flex; align-items:center; gap:3px; background:#0b1430; border:2px solid var(--ink); border-radius:12px; padding:1px 3px 1px 4px; font-size:15px; min-width:0; }
.th-pill b { flex:1; text-align:right; color:#fff; font-weight:400; overflow:hidden; }
.th-pill i { font-style:normal; color:#5be36b; font-size:20px; line-height:1; text-shadow:0 1px 0 var(--ink); }
.th-xp { position:relative; height:9px; margin-top:6px; background:#0b1430; border:2px solid var(--ink); border-radius:6px; overflow:hidden; }
.th-xp i { display:block; height:100%; background:linear-gradient(#7fe0ff,#2f9be8); } .th-xp small { position:absolute; right:4px; top:-3px; font-size:8px; color:#c9d6e8; }
#town-stage { position:relative; flex:1; overflow:hidden; }
#tscroll { position:absolute; inset:0; overflow:hidden; }
#tcv { display:block; touch-action:none; }
.enter { pointer-events:auto; display:none; align-self:center; margin-bottom:10px; padding:10px 16px; border-radius:16px; border:3px solid var(--ink); background:linear-gradient(#ffe066,#ffb020); color:var(--ink); font-family:inherit; font-size:15px; box-shadow:0 4px 0 var(--ink); animation:bob 1.2s ease-in-out infinite; }
.enter b { font-weight:400; color:#b0301f; }
#town-info { position:absolute; inset:0; pointer-events:none; padding:0; text-align:left; color:var(--text); font-size:13px; }
#town-info > * { pointer-events:auto; }
.t-left { position:absolute; left:8px; top:10px; display:flex; flex-direction:column; gap:7px; }
.chip { display:flex; align-items:center; gap:4px; background:#0b1430dd; border:2.5px solid var(--ink); border-radius:12px; padding:2px 8px 2px 4px; min-width:84px; }
.chip span { font-size:20px; filter:drop-shadow(0 2px 0 var(--ink)); } .chip b { margin-left:auto; color:#fff; font-weight:400; font-size:15px; text-shadow:0 1px 0 var(--ink); }
.chip .cbar { width:36px; height:8px; background:#2a2f45; border-radius:4px; overflow:hidden; } .chip .cbar i { display:block; height:100%; }
.chip.warn { animation:pulse 1s infinite; } @keyframes pulse { 50% { border-color:#ff4d5e; } }
.t-quest { position:absolute; left:50%; transform:translateX(-50%); top:10px; width:150px; display:flex; gap:6px; align-items:center; background:#f4f1ea; color:var(--ink); border:3px solid var(--ink); border-radius:12px; padding:5px; box-shadow:0 4px 0 var(--ink); }
.tq-ic { width:36px; height:36px; flex:none; background:#5cc0ff; border:2px solid var(--ink); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.tq-body { flex:1; min-width:0; }
.tq-bar { position:relative; height:16px; background:#0b1430; border:2px solid var(--ink); border-radius:8px; overflow:hidden; }
.tq-bar i { display:block; height:100%; background:linear-gradient(#7fe0ff,#2f9be8); } .tq-bar b { position:absolute; inset:0; text-align:center; font-weight:400; font-size:11px; line-height:13px; color:#fff; text-shadow:0 1px 0 var(--ink); }
.tq-txt { font-size:12px; margin-top:2px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.t-right { position:absolute; right:8px; top:10px; display:flex; flex-direction:column; gap:9px; }
.rb { position:relative; width:46px; height:46px; border-radius:14px; border:2.5px solid var(--ink); background:linear-gradient(#f4f1ea,#d9d3c6); font-size:24px; box-shadow:0 4px 0 var(--ink); padding:0; }
.rb:active, .big:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.dot { position:absolute; top:-5px; left:-5px; width:14px; height:14px; border-radius:50%; background:#ff3b30; border:2px solid var(--ink); }
.t-bottom { position:absolute; left:10px; right:10px; bottom:12px; display:flex; justify-content:space-between; align-items:flex-end; pointer-events:none; }
.big { pointer-events:auto; position:relative; width:72px; height:72px; border-radius:50%; border:3px solid var(--ink); background:radial-gradient(circle at 50% 35%,#4f7fd8,#1e3a78); box-shadow:0 5px 0 var(--ink); color:#fff; padding:0; }
.big span { font-size:32px; display:block; filter:drop-shadow(0 2px 0 var(--ink)); }
.big b { position:absolute; left:50%; bottom:-10px; transform:translateX(-50%); white-space:nowrap; font-weight:400; font-size:14px; background:#1b1530; border:2px solid var(--ink); border-radius:10px; padding:0 8px; }
.big.tower { width:92px; height:92px; background:radial-gradient(circle at 50% 35%,#ffe066,#ff8a1f); animation:bob 1.6s ease-in-out infinite; }
.big.tower span { font-size:42px; } .big.tower b { font-size:15px; background:#e03a52; }
@keyframes bob { 50% { transform:translateY(-4px); } }
</style>
