<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#cfe6f5">
  <title>모두의 힐러</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #cfe6f5; color: #2a2020;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; touch-action: none; }
  </style>
  <link rel="stylesheet" href="css/ui.css?v=20261013">
  <link rel="stylesheet" href="css/hud.css?v=20261013">
  <!-- 문 앞 안내를 토스트(#ui-toast, 화면 아래 90px)보다 위에 띄운다 — "준비 중" 같은 토스트가 버튼을 가리지 않게 -->
  <style>#hud #prompt { margin-bottom: 64px; }</style>
</head>
<body>
  <div id="game">
    <canvas id="view"></canvas>
    <!-- 마을 HUD: town_scene.js 가 enter 때 보이고 exit 때 숨긴다(던전 HUD 는 dungeon_scene.js 가 따로 만든다) -->
    <div id="hud" class="hidden">
      <div class="top">
        <div class="card status">
          <div class="name"><span id="hud-name">리프</span><span class="lv" id="hud-lv">Lv.1 사제</span></div>
          <div class="bar hp"><i id="hud-hp" style="width:100%"></i></div>
          <div class="bar mp"><i id="hud-mp" style="width:100%"></i></div>
          <div class="bar fatigue"><i id="hud-fatigue" style="width:0%"></i></div>
          <div class="sub"><span id="hud-hp-text">HP</span><span id="hud-fatigue-text">피로 0</span></div>
        </div>
        <div class="right">
          <div class="card gold">🪙 <span id="gold">0</span></div>
          <div class="card title">라일라 마을<small id="hud-place">1일차</small></div>
        </div>
      </div>
      <div class="bottom">
        <div id="prompt" class="card prompt hidden"><span id="prompt-name"></span><button id="prompt-btn">들어가기</button></div>
        <div id="toast" class="hidden"></div>
        <nav id="bottom-bar">
          <button id="btn-inventory" onclick="UI.open('inventory')"><span class="ic">🎒</span>가방</button>
          <button id="btn-status" onclick="UI.open('status')"><span class="ic">📜</span>상태<span class="badge hidden" id="badge-status"></span></button>
          <button id="btn-quests" onclick="UI.open('quests')"><span class="ic">❗</span>퀘스트<span class="badge hidden" id="badge-quests"></span></button>
          <button id="btn-party" onclick="UI.open('party')"><span class="ic">🛡️</span>파티<span class="badge hidden" id="badge-party"></span></button>
        </nav>
      </div>
    </div>
  </div>
